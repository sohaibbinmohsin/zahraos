# Production release for the ZahraOS Supabase project.
# A push to main applies SQL migrations, then deploys every Edge Function.
# Function deploy is this workflow. It fails when SUPABASE_ACCESS_TOKEN is unset,
# so a green run means the functions on main are the functions in production.
#
# GitHub Actions secrets (repository settings, not committed):
#   SUPABASE_ACCESS_TOKEN — Supabase account access token. Required to deploy functions.
#   SUPABASE_PROJECT_ID   — project ref. Defaults to pavejgcutmzzolyyoutg when unset.
#   SUPABASE_DB_URL       — pooler connection string used to apply migrations.
#   SUPABASE_DB_PASSWORD  — used for migrations only when SUPABASE_DB_URL is unset.

name: Supabase Production

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/supabase-migrations.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (verify migrations without applying)'
        required: false
        default: false
        type: boolean

concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Migration Files Integrity
        run: |
          echo "=== Verifying Migration Files ==="
          ls -la supabase/migrations/
          for f in supabase/migrations/*.sql; do
            echo "Checking: $f"
            if [ ! -s "$f" ]; then
              echo "Error: Migration $f is empty!"
              exit 1
            fi
          done
          echo "All migration files verified."

  deploy:
    name: Apply Migrations to Production
    needs: verify
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Deploy Migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'pavejgcutmzzolyyoutg' }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # 0016-0018 are already in the production schema but missing from
          # supabase_migrations.schema_migrations. Record them without running
          # their SQL, then push. Only 0019 and 0020 still need to execute.
          # --remote must be --remote=<url>. A following argument is not the value.
          # --yes is required: hosted changes prompt, and Actions has no terminal.
          if [ -n "$SUPABASE_DB_URL" ]; then
            echo "Recording migrations already present in production..."
            supabase migration repair --status applied --remote="$SUPABASE_DB_URL" --yes 0016 0017 0018
            echo "Applying remaining migrations via SUPABASE_DB_URL..."
            supabase db push --remote="$SUPABASE_DB_URL" --include-all --yes
          elif [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "Recording migrations already present in production..."
            supabase link --project-ref "$SUPABASE_PROJECT_ID"
            supabase migration repair --status applied --password "$SUPABASE_DB_PASSWORD" --yes 0016 0017 0018
            echo "Applying remaining migrations via Supabase project link..."
            supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all --yes
          else
            echo "::error::Missing database credentials in GitHub Secrets. Please configure either SUPABASE_DB_URL or both SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in repository secrets."
            exit 1
          fi

  dry-run:
    name: Dry Run Migrations
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Dry Run Deploy
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'pavejgcutmzzolyyoutg' }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            echo "Running dry-run migration check via SUPABASE_DB_URL..."
            supabase db push --remote="$SUPABASE_DB_URL" --dry-run --yes
          elif [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "Running dry-run migration check via Supabase project link..."
            supabase link --project-ref "$SUPABASE_PROJECT_ID"
            supabase db push --password "$SUPABASE_DB_PASSWORD" --dry-run --yes
          else
            echo "::error::Missing database credentials in GitHub Secrets."
            exit 1
          fi

  deploy-functions:
    name: Deploy Edge Functions to Production
    needs: deploy
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'pavejgcutmzzolyyoutg' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Require Supabase access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::GitHub Actions secret SUPABASE_ACCESS_TOKEN is not set on sohaibbinmohsin/zahraos. Edge Functions stay on the previously deployed code until that secret exists. Add it in repository secrets, then re-run this workflow."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::SUPABASE_PROJECT_ID is empty."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Deploy Edge Functions
        run: |
          set -euo pipefail
          deployed=0
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            if [ "$name" = "_shared" ] || [ ! -f "${dir}index.ts" ]; then
              continue
            fi
            echo "Deploying ${name}"
            supabase functions deploy "$name" \
              --import-map supabase/deno.jsonc \
              --yes \
              --remote="$SUPABASE_PROJECT_ID"
            deployed=$((deployed + 1))
          done
          if [ "$deployed" -eq 0 ]; then
            echo "::error::No Edge Functions found under supabase/functions."
            exit 1
          fi
          echo "Deployed ${deployed} Edge Functions to ${SUPABASE_PROJECT_ID}"
